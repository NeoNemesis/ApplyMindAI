# Nginx config för vilchesapp.com
# Lägg i: /etc/nginx/sites-available/vilchesapp.com
# Aktivera: ln -s /etc/nginx/sites-available/vilchesapp.com /etc/nginx/sites-enabled/
# SSL:      certbot --nginx -d vilchesapp.com -d www.vilchesapp.com

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name vilchesapp.com www.vilchesapp.com;
    return 301 https://vilchesapp.com$request_uri;
}

# Redirect www → non-www
server {
    listen 443 ssl;
    server_name www.vilchesapp.com;

    ssl_certificate     /etc/letsencrypt/live/vilchesapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vilchesapp.com/privkey.pem;

    return 301 https://vilchesapp.com$request_uri;
}

# Huvudserver
server {
    listen 443 ssl;
    server_name vilchesapp.com;

    # SSL (certbot fyller i dessa)
    ssl_certificate     /etc/letsencrypt/live/vilchesapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vilchesapp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Säkerhetsheaders
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Blockera direkt åtkomst till instance-mappen
    location /instance/ {
        return 403;
    }

    # Statiska filer serveras direkt av nginx (snabbare)
    location /static/ {
        alias /opt/applymind/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }

    # Allt annat → Flask via Docker
    location / {
        proxy_pass         http://applymind-web:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }

    # Logging
    access_log /var/log/nginx/vilchesapp.access.log;
    error_log  /var/log/nginx/vilchesapp.error.log;
}
