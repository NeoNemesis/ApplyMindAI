<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Personligt brev - $full_name</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  body { background:#0d1117; color:#c9d1d9;
      font-family:'JetBrains Mono','Fira Code','Menlo','Consolas',monospace; }
  .letter { width:900px; max-width:900px; margin:0 auto; background:#0d1117; min-height:1200px;
      border:1px solid #30363d; border-radius:8px; overflow:hidden; }

  /* Terminal titlebar */
  .term-bar { background:#161b22; border-bottom:1px solid #30363d; padding:0.7rem 1rem;
      display:flex; align-items:center; gap:0.5rem; }
  .dot { width:12px; height:12px; border-radius:50%; }
  .dot.r { background:#ff5f56; } .dot.y { background:#ffbd2e; } .dot.g { background:#27c93f; }
  .term-bar .path { margin-left:1rem; color:#8b949e; font-size:0.78rem; }

  /* Body */
  .term-body { padding:1.5rem 2rem 2rem; font-size:0.85rem; line-height:1.7; }

  /* Each command + output block */
  .cmd { color:#7ee787; margin-bottom:0.3rem; }
  .cmd::before { content:'$$ '; color:#58a6ff; }
  .output { color:#c9d1d9; margin-bottom:1.4rem; padding-left:1.2rem;
      border-left:2px solid #30363d; }

  /* Specific outputs */
  .out-header { display:flex; justify-content:space-between; align-items:flex-end;
      padding:0.5rem 0; }
  .out-header h1 { font-family:'Inter','Helvetica Neue',sans-serif; color:#fff; font-size:1.5rem;
      font-weight:700; letter-spacing:-0.01em; }
  .out-header .role { color:#7ee787; font-size:0.78rem; margin-top:0.15rem; }
  .out-header .contact { text-align:right; font-size:0.72rem; color:#8b949e; line-height:1.5; }
  .out-header .contact div { padding:0.05rem 0; }

  .out-meta { color:#8b949e; font-size:0.78rem; font-style:italic; padding:0.4rem 0; }

  .out-body { font-family:'Inter','Helvetica Neue',sans-serif; color:#c9d1d9; font-size:0.9rem;
      line-height:1.7; padding:0.6rem 0; text-align:left; word-spacing:normal; hyphens:none; }
  .out-body p { margin-bottom:1rem; }

  .out-sign { display:flex; align-items:center; gap:1rem; padding:0.6rem 0;
      font-family:'Inter','Helvetica Neue',sans-serif; }
  .out-sign .label { color:#8b949e; font-size:0.85rem; }
  .out-sign .name { color:#7ee787; font-size:1.1rem; font-weight:700;
      font-family:'JetBrains Mono',monospace; }

  .out-tail { color:#8b949e; font-size:0.72rem; font-style:italic; padding:0.4rem 0;
      font-family:'JetBrains Mono',monospace; }

  /* Prompt */
  .prompt { color:#58a6ff; margin-top:0.5rem; }
  .prompt::after { content:'_'; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<div class="letter">
  <div class="term-bar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <span class="path">~/applications/personligt_brev.md — vim — 80×50</span>
  </div>
  <div class="term-body">
    <div class="cmd">whoami --formal</div>
    <div class="output">
      <div class="out-header">
        <div>
          <h1>$full_name</h1>
          <div class="role">$job_title</div>
        </div>
        <div class="contact">$contact_info</div>
      </div>
    </div>

    <div class="cmd">date</div>
    <div class="output"><div class="out-meta">$date</div></div>

    <div class="cmd">cat cover_letter.md</div>
    <div class="output">
      <div class="out-body">
        <p style="color:#fff;font-weight:600;margin-bottom:0.8rem">$salutation</p>
        $section1_content
      </div>
    </div>

    <div class="cmd">echo --signature</div>
    <div class="output">
      <div class="out-sign">
        <span class="label">$closing_text</span>
        <span class="name">$full_name</span>
      </div>
      <div class="out-tail">$attachment_text</div>
    </div>

    <div class="prompt"></div>
  </div>
</div>
</body>
</html>
