<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, initial-scale=1.0">
    <title>Personligt Brev</title>
    <style>
        @page {
            margin: 0;
            size: A4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, 'Times New Roman', serif;
        }

        body {
            background-color: #ffffff;
        }

        .letter-container {
            width: 1000px;
            max-width: 1000px;
            background: white;
            margin: 0 auto;
            padding: 70px 90px;
        }

        /* Centrerat klassiskt sidhuvud */
        .letter-header {
            text-align: center;
            margin-bottom: 14px;
        }

        .letter-header h1 {
            font-size: 22pt;
            font-weight: normal;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .letter-header h2 {
            font-size: 10pt;
            font-weight: normal;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #777777;
            margin-bottom: 14px;
        }

        .contact-info {
            font-size: 9pt;
            color: #555555;
            line-height: 1.6;
        }

        .contact-info div {
            display: inline-block;
            margin: 0 12px;
        }

        /* Dubbel linje under sidhuvudet — klassisk brevkänsla */
        .header-rule {
            border-top: 2px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            height: 5px;
            margin-bottom: 34px;
        }

        .date {
            text-align: right;
            font-size: 10pt;
            color: #555555;
            font-style: italic;
            margin-bottom: 30px;
        }

        .salutation {
            font-size: 11pt;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .content-section {
            font-size: 11pt;
            color: #222222;
            line-height: 1.7;
            text-align: left;
        }

        .content-section p {
            margin-bottom: 14px;
        }

        .closing {
            margin-top: 36px;
        }

        .closing .sincerely {
            font-size: 11pt;
            color: #222222;
            margin-bottom: 44px;
        }

        .closing .signature {
            font-size: 13pt;
            color: #1a1a1a;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .closing .attachment {
            font-size: 8.5pt;
            font-style: italic;
            color: #888888;
            margin-top: 10px;
        }

        @media print {
            body { background: white; }
            .letter-container {
                width: 100%;
                max-width: 100%;
                padding: 50px 70px;
            }
            .header-rule {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .content-section {
            page-break-inside: avoid;
        }
    </style>
</head>
<body>
    <div class="letter-container">
        <div class="letter-header">
            <h1>$full_name</h1>
            <h2>$job_title</h2>
            <div class="contact-info">
                $contact_info
            </div>
        </div>

        <div class="header-rule"></div>

        <div class="date">$date</div>

        <div class="salutation">$salutation</div>

        <div class="content-section">
            $section1_content
        </div>

        <div class="closing">
            <div class="sincerely">$closing_text</div>
            <div class="signature">$full_name</div>
            <div class="attachment">$attachment_text</div>
        </div>
    </div>
</body>
</html>
