<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, initial-scale=1.0">
    <title>CV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #1f2933;
        }

        .cv-container {
            width: 1000px;
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
        }

        /* Blått sidhuvud över hela bredden */
        .header {
            background: #1f4e79;
            color: #ffffff;
            padding: 2.2rem 2.5rem;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .header-table {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .header-text {
            display: table-cell;
            vertical-align: middle;
        }

        .header-photo {
            display: table-cell;
            width: 140px;
            vertical-align: middle;
            text-align: right;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.6);
            display: inline-block;
            background: #e5edf5;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .header h2 {
            font-size: 1.05rem;
            font-weight: 300;
            color: #cfe0f0;
            margin-bottom: 0.8rem;
        }

        .header p {
            font-size: 0.9rem;
            line-height: 1.55;
            color: #e8f0f8;
            max-width: 90%;
        }

        /* Kolumner under headern — tabell för print-säkerhet */
        .body-table {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .left-column {
            display: table-cell;
            width: 33%;
            vertical-align: top;
            background: #f2f6fa;
            padding: 1.8rem 1.6rem;
            border-right: 1px solid #dce5ee;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .right-column {
            display: table-cell;
            width: 67%;
            vertical-align: top;
            padding: 1.8rem 2.2rem;
        }

        .section {
            margin-bottom: 1.8rem;
        }

        .section-title {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #1f4e79;
            border-bottom: 2px solid #1f4e79;
            padding-bottom: 4px;
            margin-bottom: 0.9rem;
        }

        /* Vänsterkolumnens poster */
        .education-item,
        .knowledge-item,
        .language-item {
            margin-bottom: 0.5rem;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .institution {
            color: #5a6b7c;
            font-size: 0.82rem;
            margin-top: 0.15rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.86rem;
            word-break: break-word;
        }

        .contact-item .icon {
            margin-right: 0.45rem;
        }

        /* Erfarenhet */
        .experience-item {
            margin-bottom: 1.3rem;
            padding-left: 0.9rem;
            border-left: 3px solid #cfe0f0;
        }

        .experience-title {
            font-weight: 600;
            color: #16324a;
            margin-bottom: 0.2rem;
        }

        .experience-company {
            color: #5a6b7c;
            font-size: 0.86rem;
            margin-bottom: 0.4rem;
        }

        .experience-description {
            font-size: 0.88rem;
            color: #33414e;
            line-height: 1.5;
        }

        /* Tekniska färdigheter */
        .technical-skills {
            margin-top: 1.6rem;
        }

        .technical-skills ul {
            list-style-type: none;
            padding-left: 0;
        }

        .technical-skills li {
            margin-bottom: 0.45rem;
            font-size: 0.88rem;
            color: #33414e;
        }

        @media print {
            body { background: white; }
            .cv-container {
                width: 100% !important;
                max-width: 100% !important;
            }
            .header,
            .left-column {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .experience-item,
            .education-item,
            .section { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="cv-container">
        <div class="header">
            <div class="header-table">
                <div class="header-text">
                    <h1>$full_name</h1>
                    <h2>$job_title</h2>
                    <p>$summary</p>
                </div>
                <div class="header-photo">
                    <div class="profile-image">
                        <img src="data:image/png;base64,$profile_image" alt="Profile photo">
                    </div>
                </div>
            </div>
        </div>

        <div class="body-table">
            <div class="left-column">
                <div class="section">
                    <h3 class="section-title">$contact_title</h3>
                    $contact_content
                </div>
                <div class="section">
                    <h3 class="section-title">$education_title</h3>
                    $education_content
                </div>
                <div class="section">
                    <h3 class="section-title">$skills_title</h3>
                    $skills_content
                </div>
                <div class="section">
                    <h3 class="section-title">$languages_title</h3>
                    $languages_content
                </div>
            </div>

            <div class="right-column">
                <div class="section">
                    <h3 class="section-title">$experience_title</h3>
                    $experience_content
                </div>
                <div class="section technical-skills">
                    <h3 class="section-title">$technical_skills_title</h3>
                    $technical_skills
                </div>
            </div>
        </div>
    </div>
</body>
</html>
