<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=900, initial-scale=1.0">
<title>Personligt brev - $full_name</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  body { background:#fff; padding:0; margin:0; color:#1a1a1a;
      font-family:'Inter','Helvetica Neue',Arial,sans-serif; line-height:1.6; }
  .letter-container { width:900px; max-width:900px; background:#fff; margin:0 auto; padding:3rem 3.2rem;
      min-height:1200px; position:relative; }
  .letter-container::before { content:''; position:absolute; left:0; top:0; bottom:0; width:5px;
      background:linear-gradient(180deg,#4AE54A 0%,#1de9b6 100%); }
  @media print { .letter-container { box-shadow:none; padding:2.2rem 2.5rem; } }

  /* Header */
  .header { display:flex; justify-content:space-between; align-items:flex-start;
      padding-bottom:1.2rem; border-bottom:2px solid #4AE54A; margin-bottom:1.8rem; }
  .header-name h1 { font-size:1.7rem; font-weight:700; color:#1a1a1a; margin-bottom:0.2rem; }
  .header-name .role { font-size:0.85rem; color:#666; }
  .header-contact { text-align:right; font-size:0.78rem; color:#666; line-height:1.5; }
  .header-contact div { margin-bottom:0.15rem; }

  .date-row { text-align:right; font-size:0.85rem; color:#888; margin-bottom:1.5rem; }
  .salutation { font-size:1rem; color:#1a1a1a; margin-bottom:1.4rem; font-weight:500; }

  /* Body */
  .section-label { font-size:0.7rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase;
      color:#4AE54A; margin-bottom:0.6rem; }
  .body-content { font-size:0.95rem; color:#333; line-height:1.65; text-align:left;
      word-spacing:normal; hyphens:none; }
  .body-content p { margin-bottom:1.1rem; }
  .body-content p:first-of-type { position:relative; padding-left:1.2rem; border-left:3px solid #4AE54A;
      background:rgba(74,229,74,0.04); padding:0.8rem 1rem; border-radius:0 6px 6px 0; }

  /* Closing */
  .closing { margin-top:2rem; padding-top:1.4rem; border-top:1px solid #eee; }
  .closing .sincerely { font-size:0.95rem; color:#1a1a1a; margin-bottom:1.2rem; }
  .closing .signature { font-size:1.1rem; font-weight:700; color:#1a1a1a; margin-bottom:0.6rem; }
  .attachment { font-size:0.78rem; color:#888; font-style:italic; }
</style>
</head>
<body>
<div class="letter-container">
  <div class="header">
    <div class="header-name">
      <h1>$full_name</h1>
      <div class="role">$job_title</div>
    </div>
    <div class="header-contact">$contact_info</div>
  </div>
  <div class="date-row">$date</div>
  <div class="salutation">$salutation</div>
  <div class="section-label">Min ansökan</div>
  <div class="body-content">$section1_content</div>
  <div class="closing">
    <div class="sincerely">$closing_text</div>
    <div class="signature">$full_name</div>
    <div class="attachment">$attachment_text</div>
  </div>
</div>
</body>
</html>
