<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, initial-scale=1.0">
    <title>CV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #ffffff;
            color: #1a1a1a;
        }

        .cv-container {
            width: 1000px;
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 56px 64px;
        }

        /* Header */
        .header {
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 18px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #111111;
            margin-bottom: 4px;
        }

        .header h2 {
            font-size: 1rem;
            font-weight: 400;
            color: #666666;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 0.92rem;
            color: #444444;
            line-height: 1.6;
        }

        /* Sektioner */
        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #333333;
            border-bottom: 1px solid #dddddd;
            padding-bottom: 5px;
            margin-bottom: 12px;
        }

        /* Erfarenhet */
        .experience-item {
            margin-bottom: 1.2rem;
        }

        .experience-title {
            font-weight: bold;
            color: #111111;
            margin-bottom: 0.2rem;
        }

        .experience-company {
            color: #666666;
            font-size: 0.88rem;
            margin-bottom: 0.4rem;
        }

        .experience-description {
            font-size: 0.9rem;
            color: #333333;
            line-height: 1.5;
        }

        /* Vänsterkolumns-innehåll (utbildning, kunskaper, språk, kontakt) */
        .education-item,
        .knowledge-item,
        .language-item {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .institution {
            color: #666666;
            font-size: 0.85rem;
            margin-top: 0.15rem;
        }

        .contact-item {
            display: inline-block;
            margin-right: 1.6rem;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        .contact-item .icon {
            margin-right: 0.35rem;
        }

        /* Tekniska färdigheter */
        .technical-skills ul {
            list-style-type: none;
            padding-left: 0;
        }

        .technical-skills li {
            margin-bottom: 0.45rem;
            font-size: 0.9rem;
            color: #333333;
        }

        /* Tvåspalt för utbildning/kunskaper/språk via tabell (print-säkert) */
        .meta-grid {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .meta-col {
            display: table-cell;
            vertical-align: top;
            padding-right: 28px;
        }

        .meta-col:last-child {
            padding-right: 0;
        }

        @media print {
            body { background: white; }
            .cv-container {
                width: 100% !important;
                max-width: 100% !important;
                padding: 36px 44px;
            }
            .experience-item,
            .education-item,
            .section { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="cv-container">
        <!-- Header: namn, titel, sammanfattning, kontakt -->
        <div class="header">
            <h1>$full_name</h1>
            <h2>$job_title</h2>
            <p>$summary</p>
        </div>

        <div class="section">
            <h3 class="section-title">$contact_title</h3>
            $contact_content
        </div>

        <div class="section">
            <h3 class="section-title">$experience_title</h3>
            $experience_content
        </div>

        <div class="section technical-skills">
            <h3 class="section-title">$technical_skills_title</h3>
            $technical_skills
        </div>

        <div class="section">
            <div class="meta-grid">
                <div class="meta-col">
                    <h3 class="section-title">$education_title</h3>
                    $education_content
                </div>
                <div class="meta-col">
                    <h3 class="section-title">$skills_title</h3>
                    $skills_content
                </div>
                <div class="meta-col">
                    <h3 class="section-title">$languages_title</h3>
                    $languages_content
                </div>
            </div>
        </div>
    </div>
</body>
</html>
