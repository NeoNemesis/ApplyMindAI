<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1000, initial-scale=1.0">
<title>CV - $full_name</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Helvetica Neue',Arial,sans-serif;
      -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  body { background:#fff; padding:0; margin:0; color:#1a1a1a; }
  .cv-container { width:1000px; max-width:1000px; background:#fff; display:flex; margin:0 auto;
      box-shadow:0 0 20px rgba(0,0,0,0.08); position:relative; min-height:1400px; }
  @media print { .cv-container { display:table !important; table-layout:fixed !important; box-shadow:none; } }

  /* Vänster panel: mörk grön gradient */
  .left-column { width:35%; background:linear-gradient(180deg,#0e1d14 0%,#162b1f 100%); color:#e8f5e9; padding:2.5rem 1.8rem; }
  .profile-image { width:140px; height:140px; border-radius:50%; margin:0 auto 1.5rem; overflow:hidden;
      border:3px solid #4AE54A; box-shadow:0 0 0 4px rgba(74,229,74,0.12); }
  .profile-image img { width:100%; height:100%; object-fit:cover; }
  .section { margin-bottom:1.6rem; }
  .section-title { font-size:0.78rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase;
      color:#4AE54A; padding-bottom:0.45rem; border-bottom:1px solid rgba(74,229,74,0.3); margin-bottom:0.85rem; }
  .left-column .section *, .left-column li { font-size:0.86rem; line-height:1.55; color:#d6e8d9;
      text-align:left; word-spacing:normal; hyphens:none; }
  .left-column ul { list-style:none; padding:0; }
  .left-column li { padding:0.18rem 0; }
  .left-column strong { color:#fff; }

  /* Höger kolumn: ljus med grön accent */
  .right-column { width:65%; padding:0; background:#fff; }
  .header { background:#1a1a1a; color:#fff; padding:2.5rem 2.2rem 1.8rem;
      border-left:6px solid #4AE54A; }
  .header h1 { font-size:2.2rem; font-weight:700; letter-spacing:-0.01em; margin-bottom:0.2rem; }
  .header h2 { font-size:1rem; font-weight:500; color:#4AE54A; font-family:'JetBrains Mono','Menlo',monospace;
      margin-bottom:0.9rem; }
  .header h2::before { content:'// '; color:#4AE54A; opacity:0.7; }
  .header p { font-size:0.92rem; line-height:1.55; color:#d4d4d4; text-align:left;
      word-spacing:normal; hyphens:none; }

  .experience { padding:1.8rem 2.2rem 2rem; }
  .experience > .section-title { color:#0e1d14; border-color:#4AE54A; }
  .experience-item { margin-bottom:1.3rem; padding-left:1rem; border-left:3px solid #4AE54A; }
  .experience-item h4, .experience h4 { font-size:1rem; font-weight:700; color:#1a1a1a; margin-bottom:0.15rem; }
  .experience-item .company, .experience .company { font-size:0.85rem; color:#4d7a55; margin-bottom:0.45rem; }
  .experience-item p, .experience p, .experience-item li, .experience li {
      font-size:0.88rem; color:#333; line-height:1.55; text-align:left; word-spacing:normal; hyphens:none; }
  .experience ul { padding-left:1.2rem; margin-top:0.3rem; }

  .technical-skills { margin-top:1.6rem; padding-top:1.2rem; border-top:1px solid #e0e0e0; }
  .technical-skills h4 { font-size:0.78rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase;
      color:#0e1d14; margin-bottom:0.85rem; }
  .technical-skills ul { list-style:none; display:flex; flex-wrap:wrap; gap:0.4rem; padding:0; }
  .technical-skills li { font-size:0.78rem; padding:0.28rem 0.7rem; background:rgba(74,229,74,0.1);
      border:1px solid rgba(74,229,74,0.35); border-radius:4px; color:#1a3d22;
      font-family:'JetBrains Mono','Menlo',monospace; }
</style>
</head>
<body>
<div class="cv-container">
  <div class="left-column">
    <div class="profile-image"><img src="data:image/png;base64,$profile_image" alt="Profile"></div>
    <div class="section"><h3 class="section-title">$education_title</h3>$education_content</div>
    <div class="section"><h3 class="section-title">$skills_title</h3>$skills_content</div>
    <div class="section"><h3 class="section-title">$languages_title</h3>$languages_content</div>
    <div class="section"><h3 class="section-title">$contact_title</h3>$contact_content</div>
  </div>
  <div class="right-column">
    <div class="header">
      <h1>$full_name</h1>
      <h2>$job_title</h2>
      <p>$summary</p>
    </div>
    <div class="experience">
      <h3 class="section-title">$experience_title</h3>
      $experience_content
      <div class="technical-skills">
        <h4>$technical_skills_title</h4>
        $technical_skills
      </div>
    </div>
  </div>
</div>
</body>
</html>
