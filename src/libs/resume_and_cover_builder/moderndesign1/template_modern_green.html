<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>CV - $full_name</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Helvetica Neue',Arial,sans-serif;
      -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  body { background:#fff; color:#1a1a1a; }
  .cv { width:1000px; max-width:1000px; margin:0 auto; background:#fff; min-height:1400px; }

  /* HERO — stor centrerad header, helt singel-column */
  .hero { background:linear-gradient(135deg,#0b3d22 0%,#1e7a4a 50%,#4AE54A 100%);
      padding:3rem 2.5rem 2.5rem; color:#fff; text-align:center; position:relative; overflow:hidden; }
  .hero::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:40px;
      background:linear-gradient(180deg,transparent 0%,#fff 100%); }
  .hero h1 { font-size:2.8rem; font-weight:800; letter-spacing:-0.02em; margin-bottom:0.4rem; }
  .hero .role { font-size:1rem; font-weight:500; opacity:0.9; margin-bottom:1.2rem;
      letter-spacing:0.05em; text-transform:uppercase; }
  .hero .summary { max-width:780px; margin:0 auto; font-size:0.92rem; line-height:1.6; opacity:0.95;
      text-align:left; word-spacing:normal; hyphens:none; }

  /* Contact bar — horisontellt */
  .contact-bar { background:#0b3d22; color:#a8e6c1; padding:0.9rem 2.5rem;
      display:flex; justify-content:center; flex-wrap:wrap; gap:1.5rem; font-size:0.82rem; }
  .contact-bar > * { display:inline-flex; align-items:center; gap:0.4rem; }
  .contact-bar div { color:#fff; }

  /* Main wrapper */
  .main { padding:2.5rem 3rem 3rem; }

  /* TIMELINE for experience */
  .timeline-title { font-size:0.85rem; font-weight:800; letter-spacing:0.25em; text-transform:uppercase;
      color:#0b3d22; border-bottom:3px solid #4AE54A; padding-bottom:0.6rem; margin-bottom:1.5rem; }
  .timeline { position:relative; padding-left:2rem; }
  .timeline::before { content:''; position:absolute; left:0.55rem; top:0; bottom:0; width:2px;
      background:linear-gradient(180deg,#4AE54A 0%,#0b3d22 100%); }
  .timeline-item { position:relative; margin-bottom:1.5rem; }
  .timeline-item::before { content:''; position:absolute; left:-1.7rem; top:0.3rem; width:14px; height:14px;
      border-radius:50%; background:#4AE54A; border:3px solid #0b3d22; }
  .timeline-item h4 { font-size:1.05rem; font-weight:700; color:#0b3d22; margin-bottom:0.15rem; }
  .timeline-item .company, .timeline .company { font-size:0.82rem; color:#4d7a55;
      font-weight:600; margin-bottom:0.4rem; }
  .timeline-item p, .timeline-item li, .timeline p, .timeline li { font-size:0.88rem; line-height:1.55;
      color:#333; text-align:left; word-spacing:normal; hyphens:none; }
  .timeline ul { padding-left:1.2rem; margin-top:0.3rem; }

  /* 3-column grid for skills/education/languages */
  .info-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; margin-top:2.5rem;
      padding-top:2rem; border-top:1px solid #e0e0e0; }
  .info-card { background:#f5fbf6; border:1px solid #d4f0db; border-radius:8px; padding:1.2rem 1.1rem; }
  .info-card h3 { font-size:0.72rem; font-weight:800; letter-spacing:0.2em; text-transform:uppercase;
      color:#0b3d22; margin-bottom:0.7rem; padding-bottom:0.4rem; border-bottom:1px solid #c5e3cd; }
  .info-card * { font-size:0.84rem; line-height:1.5; color:#1a1a1a; text-align:left;
      word-spacing:normal; hyphens:none; }
  .info-card div { padding:0.18rem 0; }
  .info-card .institution { font-size:0.75rem; opacity:0.65; }

  /* Skills as big tags */
  .tech-section { margin-top:2rem; padding-top:1.5rem; border-top:1px solid #e0e0e0; }
  .tech-section h3 { font-size:0.85rem; font-weight:800; letter-spacing:0.25em; text-transform:uppercase;
      color:#0b3d22; margin-bottom:1rem; }
  .tech-section ul { list-style:none; display:flex; flex-wrap:wrap; gap:0.5rem; padding:0; }
  .tech-section li { font-size:0.8rem; padding:0.4rem 0.95rem; background:#0b3d22; color:#fff;
      border-radius:20px; font-weight:500; }
</style>
</head>
<body>
<div class="cv">
  <div class="hero">
    <h1>$full_name</h1>
    <div class="role">$job_title</div>
    <div class="summary">$summary</div>
  </div>
  <div class="contact-bar">$contact_content</div>
  <div class="main">
    <h2 class="timeline-title">$experience_title</h2>
    <div class="timeline">$experience_content</div>
    <div class="info-grid">
      <div class="info-card"><h3>$education_title</h3>$education_content</div>
      <div class="info-card"><h3>$skills_title</h3>$skills_content</div>
      <div class="info-card"><h3>$languages_title</h3>$languages_content</div>
    </div>
    <div class="tech-section">
      <h3>$technical_skills_title</h3>
      $technical_skills
    </div>
  </div>
</div>
</body>
</html>
