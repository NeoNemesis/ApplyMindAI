services:
  applymind-web:
    build: .
    container_name: applymind-web
    restart: unless-stopped
    env_file: .env.production
    environment:
      - FLASK_ENV=production
      - PYTHONIOENCODING=utf-8
    volumes:
      - applymind-instance:/app/instance
    networks:
      - applymind-net
      - taskit-net
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  applymind-instance:
    name: applymind-instance

networks:
  applymind-net:
    name: applymind-net
  taskit-net:
    external: true
    name: taskit-net
