services:
  applymind-web:
    build: .
    container_name: applymind-web
    restart: unless-stopped
    env_file: .env.production
    environment:
      - FLASK_ENV=production
      - PYTHONIOENCODING=utf-8
    volumes:
      - applymind-instance:/app/instance
      - ./data_folder:/app/data_folder
      - ./web_app.py:/app/web_app.py:ro
      - ./job_master.py:/app/job_master.py:ro
      - ./auth.py:/app/auth.py:ro
      - ./models.py:/app/models.py:ro
      - ./admin.py:/app/admin.py:ro
      - ./config.py:/app/config.py:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - ./src:/app/src:ro
    networks:
      - applymind-net
      - taskit-net
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "4", "--timeout", "300", "web_app:app"]
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  applymind-instance:
    name: applymind-instance

networks:
  applymind-net:
    name: applymind-net
  taskit-net:
    external: true
    name: taskit-net
