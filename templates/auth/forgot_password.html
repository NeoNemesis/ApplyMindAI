<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Glömt lösenord — ApplyMind AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #4AE54A; --green-glow: rgba(74,229,74,0.15);
      --bg: #111; --surface: #1a1a1a; --surface2: #222;
      --border: #2a2a2a; --text: #e8e8e8; --muted: #777;
      --success: #4AE54A; --success-bg: rgba(74,229,74,0.08);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    body::before { content:''; position:fixed; inset:0; background-image: linear-gradient(rgba(74,229,74,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(74,229,74,0.03) 1px,transparent 1px); background-size:48px 48px; pointer-events:none; z-index:0; }

    .card { position:relative; z-index:1; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:40px; width:100%; max-width:400px; box-shadow:0 24px 64px rgba(0,0,0,0.6); }
    .card::before { content:''; position:absolute; top:0; left:10%; right:10%; height:1px; background:linear-gradient(90deg,transparent,var(--green),transparent); }

    .logo { display:flex; align-items:center; gap:10px; margin-bottom:28px; text-decoration:none; color:var(--text); }
    .logo-icon { width:32px; height:32px; background:rgba(74,229,74,0.1); border:1px solid rgba(74,229,74,0.25); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--green); }

    h1 { font-size:20px; font-weight:700; margin-bottom:6px; letter-spacing:-0.3px; }
    .subtitle { font-size:13px; color:var(--muted); margin-bottom:24px; line-height:1.6; }

    label { display:block; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:5px; }
    input[type="email"] { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:11px 14px; font-size:14px; font-family:inherit; color:var(--text); outline:none; transition:border-color 150ms,box-shadow 150ms; margin-bottom:20px; }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px var(--green-glow); }

    .btn { width:100%; background:var(--green); color:#111; border:none; border-radius:8px; padding:12px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; transition:background 150ms; }
    .btn:hover { background:#38c438; }

    .success-box { background:var(--success-bg); border:1px solid rgba(74,229,74,0.2); border-radius:8px; padding:16px; font-size:13px; color:var(--success); line-height:1.6; margin-bottom:20px; }

    .back-link { display:block; text-align:center; font-size:12px; color:var(--muted); margin-top:20px; text-decoration:none; }
    .back-link:hover { color:var(--text); }
  </style>
</head>
<body>
<div class="card">
  <a href="/auth/login" class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </div>
    <span style="font-weight:700;font-size:15px;">ApplyMind AI</span>
  </a>

  {% if sent %}
  <h1>Kolla din inbox</h1>
  <p class="subtitle">Om e-postadressen finns i systemet har vi skickat en återställningslänk. Kolla även skräppost.</p>
  <div class="success-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:6px;"><polyline points="20 6 9 17 4 12"/></svg>
    Länken är giltig i 1 timme.
  </div>

  {% else %}
  <h1>Glömt lösenordet?</h1>
  <p class="subtitle">Ange din e-postadress så skickar vi en återställningslänk.</p>
  <form method="POST">
    <label for="email">E-postadress</label>
    <input type="email" id="email" name="email" placeholder="din@epost.se" required autofocus>
    <button type="submit" class="btn">Skicka återställningslänk</button>
  </form>
  {% endif %}

  <a href="/auth/login" class="back-link">← Tillbaka till inloggning</a>
</div>
</body>
</html>
