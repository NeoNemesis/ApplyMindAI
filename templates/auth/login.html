<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logga in — ApplyMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
    }

    #sp-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    .page {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      width: 100%;
    }

    .hero-title {
      font-size: clamp(48px, 8vw, 80px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      text-align: center;
      color: #fff;
      position: relative;
      z-index: 20;
    }

    .sparkle-beam {
      width: 100%;
      max-width: 480px;
      height: 120px;
      position: relative;
      margin-top: -4px;
    }

    .beam-line-1 {
      position: absolute;
      left: 15%; top: 0;
      height: 2px;
      width: 70%;
      background: linear-gradient(90deg, transparent, #4AE54A, transparent);
      filter: blur(3px);
    }
    .beam-line-2 {
      position: absolute;
      left: 15%; top: 0;
      height: 1px;
      width: 70%;
      background: linear-gradient(90deg, transparent, #4AE54A, transparent);
    }
    .beam-line-3 {
      position: absolute;
      left: 35%; top: 0;
      height: 5px;
      width: 30%;
      background: linear-gradient(90deg, transparent, #a8f5a8, transparent);
      filter: blur(4px);
    }
    .beam-line-4 {
      position: absolute;
      left: 35%; top: 0;
      height: 1px;
      width: 30%;
      background: linear-gradient(90deg, transparent, #a8f5a8, transparent);
    }

    #sp-beam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .beam-mask {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, transparent 30%, #000 80%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      background: rgba(15,15,15,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-top-color: rgba(74,229,74,0.2);
      border-radius: 16px;
      padding: 36px 40px;
      backdrop-filter: blur(20px);
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 13px;
      color: #555;
      margin-bottom: 28px;
    }

    .error-banner {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #EF4444;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
      animation: shake .4s cubic-bezier(.36,.07,.19,.97);
    }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }

    .field { position: relative; margin-bottom: 16px; }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 22px 14px 8px;
      font-size: 14px;
      font-family: inherit;
      color: #fff;
      outline: none;
      transition: border-color 200ms, box-shadow 200ms;
    }
    .field input:focus {
      border-color: rgba(74,229,74,0.5);
      box-shadow: 0 0 0 3px rgba(74,229,74,0.1);
    }
    .field label {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 14px; color: #555;
      pointer-events: none;
      transition: all 180ms ease;
    }
    .field input:focus ~ label,
    .field input:not(:placeholder-shown) ~ label {
      top: 10px; transform: none;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      color: #4AE54A;
    }

    .row-actions {
      display: flex; align-items: center;
      justify-content: space-between;
      margin: 12px 0 24px;
    }
    .remember {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: #555; cursor: pointer;
    }
    .remember input[type="checkbox"] { accent-color: #4AE54A; }
    .forgot { font-size: 12px; color: #555; text-decoration: none; transition: color 150ms; }
    .forgot:hover { color: #4AE54A; }

    .btn {
      width: 100%;
      position: relative; overflow: hidden;
      background: #4AE54A; color: #000;
      border: none; border-radius: 10px;
      padding: 13px; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform 120ms, box-shadow 200ms;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 32px rgba(74,229,74,0.5);
    }
    .btn:active { transform: scale(.98); box-shadow: none; }
    .btn:disabled { background: #1a2e1a; color: #3a5a3a; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
      transform: translateX(-100%);
    }
    .btn:hover .btn-shimmer { transform: translateX(100%); transition: transform .5s ease; }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(0,0,0,.2); border-top-color: #000;
      border-radius: 50%; animation: spin .65s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn.loading .spinner { display: block; }
    .btn.loading .btn-text { display: none; }

    .footer { text-align: center; margin-top: 20px; font-size: 12px; }
    .footer a { color: #444; text-decoration: none; transition: color 150ms; }
    .footer a:hover { color: #4AE54A; }
  </style>
</head>
<body>

  <div id="sp-bg"></div>

  <div class="page">
    <div class="hero">
      <h1 class="hero-title">ApplyMind AI</h1>
      <div class="sparkle-beam">
        <div class="beam-line-1"></div>
        <div class="beam-line-2"></div>
        <div class="beam-line-3"></div>
        <div class="beam-line-4"></div>
        <div id="sp-beam"></div>
        <div class="beam-mask"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Välkommen tillbaka</div>
      <p class="card-sub">Logga in för att fortsätta din jobbsökning.</p>

      {% if error %}
      <div class="error-banner" role="alert">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST"
            action="{{ url_for('auth.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}"
            id="login-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

        <div class="field">
          <input type="text" id="email" name="email" placeholder=" "
                 autocomplete="username" required
                 value="{{ request.form.get('email', '') }}">
          <label for="email">E-post eller användarnamn</label>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder=" "
                 autocomplete="current-password" required>
          <label for="password">Lösenord</label>
        </div>

        <div class="row-actions">
          <label class="remember">
            <input type="checkbox" name="remember"
                   {% if request.form.get('remember') %}checked{% endif %}>
            Kom ihåg mig
          </label>
          <a href="/auth/forgot-password" class="forgot">Glömt lösenordet?</a>
        </div>

        <button type="submit" class="btn" id="login-btn"
                {% if rate_wait %}disabled{% endif %}>
          <span class="btn-shimmer"></span>
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">
            {% if rate_wait %}Vänta {{ rate_wait }}s…{% else %}Logga in{% endif %}
          </span>
        </button>
      </form>

      <div class="footer">
        <a href="/">← Tillbaka till startsidan</a>
      </div>
    </div>
  </div>

  <script>
    // ── Full-page background sparkles (canvas) ──────────────────────────
    (function() {
      var canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
      document.getElementById('sp-bg').appendChild(canvas);
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var W, H, particles = [];

      function resize() {
        W = canvas.width  = window.innerWidth  * dpr;
        H = canvas.height = window.innerHeight * dpr;
        canvas.style.width  = window.innerWidth  + 'px';
        canvas.style.height = window.innerHeight + 'px';
      }

      function rand(a, b) { return a + Math.random() * (b - a); }

      function spawn() {
        return {
          x:    rand(0, W),
          y:    rand(0, H),
          r:    rand(0.6, 1.4) * dpr,
          op:   rand(0.1, 1),
          dop:  rand(0.002, 0.008) * (Math.random() < 0.5 ? 1 : -1),
          vx:   rand(-0.15, 0.15) * dpr,
          vy:   rand(-0.15, 0.15) * dpr
        };
      }

      resize();
      window.addEventListener('resize', function() { resize(); particles = []; init(); });

      function init() {
        var n = Math.round((W * H) / (1920 * 1080 / 100 * dpr * dpr));
        n = Math.max(60, Math.min(n, 200));
        for (var i = 0; i < n; i++) particles.push(spawn());
      }
      init();

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#4AE54A';
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.op += p.dop;
          if (p.op > 1)   { p.op = 1;   p.dop = -Math.abs(p.dop); }
          if (p.op < 0.1) { p.op = 0.1; p.dop =  Math.abs(p.dop); }
          p.x += p.vx; p.y += p.vy;
          if (p.x < -5)  p.x = W + 5;
          if (p.x > W+5) p.x = -5;
          if (p.y < -5)  p.y = H + 5;
          if (p.y > H+5) p.y = -5;
          ctx.globalAlpha = p.op;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // ── Beam sparkles under title (canvas, high density) ─────────────────
    (function() {
      var beam = document.getElementById('sp-beam');
      var canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
      beam.appendChild(canvas);
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var W, H, particles = [];

      function resize() {
        W = canvas.width  = beam.offsetWidth  * dpr;
        H = canvas.height = beam.offsetHeight * dpr;
      }

      function rand(a, b) { return a + Math.random() * (b - a); }

      function spawn() {
        return {
          x:   rand(0, W),
          y:   rand(0, H),
          r:   rand(0.4, 1.0) * dpr,
          op:  rand(0.1, 1),
          dop: rand(0.01, 0.03) * (Math.random() < 0.5 ? 1 : -1),
          vx:  rand(-0.3, 0.3) * dpr,
          vy:  rand(-0.3, 0.3) * dpr
        };
      }

      resize();
      for (var i = 0; i < 800; i++) particles.push(spawn());

      function draw() {
        resize();
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#4AE54A';
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.op += p.dop;
          if (p.op > 1)   { p.op = 1;   p.dop = -Math.abs(p.dop); }
          if (p.op < 0.1) { p.op = 0.1; p.dop =  Math.abs(p.dop); }
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
          ctx.globalAlpha = p.op;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
      }
      draw();
    })();

    document.getElementById('login-form').addEventListener('submit', function() {
      var btn = document.getElementById('login-btn');
      if (!btn.disabled) { btn.classList.add('loading'); btn.disabled = true; }
    });

    {% if rate_wait and rate_wait > 0 %}
    var wait = {{ rate_wait }};
    var btn = document.getElementById('login-btn');
    var txtEl = btn.querySelector('.btn-text');
    var timer = setInterval(function() {
      if (--wait <= 0) { clearInterval(timer); btn.disabled = false; txtEl.textContent = 'Logga in'; }
      else { txtEl.textContent = 'Vänta ' + wait + 's…'; }
    }, 1000);
    {% endif %}
  </script>
</body>
</html>
