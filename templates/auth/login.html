<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logga in — ApplyMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    #sp-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    .page {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
    }

    /* ── Hero ─────────────────────────────────────────────────── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
      width: 100%;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(74,229,74,0.08);
      border: 1px solid rgba(74,229,74,0.2);
      border-radius: 100px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #4AE54A;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .hero-badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4AE54A;
      box-shadow: 0 0 6px #4AE54A;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .hero-title {
      font-size: clamp(40px, 8vw, 72px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      text-align: center;
      color: #fff;
      position: relative;
      z-index: 20;
    }

    .hero-title .ai {
      color: #4AE54A;
      text-shadow: 0 0 40px rgba(74,229,74,0.5), 0 0 80px rgba(74,229,74,0.2);
    }

    /* ── Beam (reduced height) ────────────────────────────────── */
    .sparkle-beam {
      width: 100%;
      max-width: 560px;
      height: 90px;
      position: relative;
      margin-top: -4px;
      flex-shrink: 0;
    }

    .beam-line-1 {
      position: absolute;
      left: 10%; top: 0;
      height: 2px;
      width: 80%;
      background: linear-gradient(90deg, transparent, #4AE54A, transparent);
      filter: blur(3px);
    }
    .beam-line-2 {
      position: absolute;
      left: 10%; top: 0;
      height: 1px;
      width: 80%;
      background: linear-gradient(90deg, transparent, #4AE54A, transparent);
    }
    .beam-line-3 {
      position: absolute;
      left: 30%; top: 0;
      height: 4px;
      width: 40%;
      background: linear-gradient(90deg, transparent, #a8f5a8, transparent);
      filter: blur(4px);
    }
    .beam-line-4 {
      position: absolute;
      left: 30%; top: 0;
      height: 1px;
      width: 40%;
      background: linear-gradient(90deg, transparent, #a8f5a8, transparent);
    }

    #sp-beam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .beam-mask {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 0%, transparent 20%, #000 75%);
      pointer-events: none;
    }

    /* ── Card ─────────────────────────────────────────────────── */
    .card {
      width: 100%;
      background: rgba(12,12,12,0.95);
      border: 1px solid rgba(255,255,255,0.07);
      border-top: 1px solid rgba(74,229,74,0.3);
      border-radius: 18px;
      padding: 32px 36px 28px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 0 0 1px rgba(74,229,74,0.04) inset,
                  0 24px 48px rgba(0,0,0,0.6);
      animation: card-in 0.4s cubic-bezier(0.23,1,0.32,1) both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 3px;
    }
    .card-sub {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }

    /* ── Error ────────────────────────────────────────────────── */
    .error-banner {
      background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #EF4444;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
      animation: shake .4s cubic-bezier(.36,.07,.19,.97);
    }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }

    /* ── Form fields ──────────────────────────────────────────── */
    .field { position: relative; margin-bottom: 14px; }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: 22px 14px 8px;
      font-size: 14px;
      font-family: inherit;
      color: #fff;
      outline: none;
      transition: border-color 180ms, box-shadow 180ms, background 180ms;
    }
    .field input:hover {
      border-color: rgba(255,255,255,0.15);
    }
    .field input:focus {
      background: rgba(74,229,74,0.03);
      border-color: rgba(74,229,74,0.45);
      box-shadow: 0 0 0 3px rgba(74,229,74,0.08);
    }
    .field label {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 14px; color: #555;
      pointer-events: none;
      transition: all 180ms ease;
    }
    .field input:focus ~ label,
    .field input:not(:placeholder-shown) ~ label {
      top: 10px; transform: none;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      color: #4AE54A;
    }

    /* ── Row actions ──────────────────────────────────────────── */
    .row-actions {
      display: flex; align-items: center;
      justify-content: space-between;
      margin: 10px 0 20px;
    }
    .remember {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: #555; cursor: pointer;
      user-select: none;
    }
    .remember input[type="checkbox"] { accent-color: #4AE54A; }
    .forgot { font-size: 12px; color: #555; text-decoration: none; transition: color 150ms; }
    .forgot:hover { color: #4AE54A; }

    /* ── Button ───────────────────────────────────────────────── */
    .btn {
      width: 100%;
      position: relative; overflow: hidden;
      background: #4AE54A; color: #000;
      border: none; border-radius: 10px;
      padding: 13px; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform 120ms, box-shadow 200ms, background 150ms;
    }
    .btn:hover {
      transform: translateY(-1px);
      background: #5cf55c;
      box-shadow: 0 6px 24px rgba(74,229,74,0.45);
    }
    .btn:active { transform: scale(.98); box-shadow: none; }
    .btn:disabled { background: #182818; color: #3a5a3a; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      transform: translateX(-100%);
    }
    .btn:not(:disabled):hover .btn-shimmer {
      transform: translateX(100%);
      transition: transform .5s ease;
    }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(0,0,0,.2); border-top-color: #000;
      border-radius: 50%; animation: spin .65s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn.loading .spinner { display: block; }
    .btn.loading .btn-text { display: none; }

    /* ── Footer ───────────────────────────────────────────────── */
    .footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 11px;
      color: #3a3a3a;
      letter-spacing: 0.02em;
    }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 480px) {
      body {
        padding: 12px 12px;
        justify-content: flex-start;
        padding-top: max(32px, 5vh);
      }

      .hero-badge { margin-bottom: 12px; }

      .hero-title {
        font-size: clamp(32px, 10vw, 48px);
        letter-spacing: -1.5px;
      }

      .hero { margin-bottom: 4px; }

      .sparkle-beam {
        height: 60px;
      }

      .card {
        padding: 24px 20px 20px;
        border-radius: 14px;
      }

      .card-title { font-size: 17px; }

      /* Prevent iOS zoom on input focus */
      .field input { font-size: 16px; }

      .btn { padding: 14px; }
    }

    @media (max-width: 360px) {
      .hero-title { font-size: clamp(28px, 9vw, 38px); }
      .card { padding: 20px 16px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-shimmer { display: none; }
      .spinner { animation: none; }
      .hero-badge-dot { animation: none; }
      .card { animation: none; }
    }
  </style>
</head>
<body>

  <div id="sp-bg"></div>

  <div class="page">
    <div class="hero">
      <div class="hero-badge">
        <span class="hero-badge-dot" aria-hidden="true"></span>
        Jobbsökning med AI
      </div>
      <h1 class="hero-title">ApplyMind <span class="ai">AI</span></h1>
      <div class="sparkle-beam" aria-hidden="true">
        <div class="beam-line-1"></div>
        <div class="beam-line-2"></div>
        <div class="beam-line-3"></div>
        <div class="beam-line-4"></div>
        <div id="sp-beam"></div>
        <div class="beam-mask"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Välkommen tillbaka</div>
        <p class="card-sub">Logga in för att fortsätta din jobbsökning.</p>
      </div>

      {% if error %}
      <div class="error-banner" role="alert">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST"
            action="{{ url_for('auth.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}"
            id="login-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

        <div class="field">
          <input type="text" id="email" name="email" placeholder=" "
                 autocomplete="username" required
                 value="{{ request.form.get('email', '') }}">
          <label for="email">E-post eller användarnamn</label>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder=" "
                 autocomplete="current-password" required>
          <label for="password">Lösenord</label>
        </div>

        <div class="row-actions">
          <label class="remember">
            <input type="checkbox" name="remember"
                   {% if request.form.get('remember') %}checked{% endif %}>
            Kom ihåg mig
          </label>
          <a href="/auth/forgot-password" class="forgot">Glömt lösenordet?</a>
        </div>

        <button type="submit" class="btn" id="login-btn"
                {% if rate_wait %}disabled{% endif %}>
          <span class="btn-shimmer" aria-hidden="true"></span>
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">
            {% if rate_wait %}Vänta {{ rate_wait }}s…{% else %}Logga in{% endif %}
          </span>
        </button>
      </form>

      <div class="footer">ApplyMind AI &copy; 2026 &mdash; Victor Vilches</div>
    </div>
  </div>

  <script>
    // ── Full-page background sparkles ───────────────────────────
    (function() {
      var canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
      document.getElementById('sp-bg').appendChild(canvas);
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W, H, particles = [];

      function resize() {
        W = canvas.width  = window.innerWidth  * dpr;
        H = canvas.height = window.innerHeight * dpr;
        canvas.style.width  = window.innerWidth  + 'px';
        canvas.style.height = window.innerHeight + 'px';
      }

      function rand(a, b) { return a + Math.random() * (b - a); }

      function spawn() {
        return {
          x:   rand(0, W), y:   rand(0, H),
          r:   rand(0.5, 1.2) * dpr,
          op:  rand(0.05, 0.7),
          dop: rand(0.002, 0.006) * (Math.random() < .5 ? 1 : -1),
          vx:  rand(-0.1, 0.1) * dpr,
          vy:  rand(-0.1, 0.1) * dpr
        };
      }

      resize();
      window.addEventListener('resize', function() { resize(); particles = []; init(); });

      function init() {
        var n = Math.round((W * H) / (1920 * 1080 / 80 * dpr * dpr));
        n = Math.max(40, Math.min(n, 140));
        for (var i = 0; i < n; i++) particles.push(spawn());
      }
      init();

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#4AE54A';
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.op += p.dop;
          if (p.op > 0.7)  { p.op = 0.7;  p.dop = -Math.abs(p.dop); }
          if (p.op < 0.05) { p.op = 0.05; p.dop =  Math.abs(p.dop); }
          p.x += p.vx; p.y += p.vy;
          if (p.x < -5)  p.x = W + 5; if (p.x > W+5) p.x = -5;
          if (p.y < -5)  p.y = H + 5; if (p.y > H+5) p.y = -5;
          ctx.globalAlpha = p.op;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // ── Beam sparkles under title ───────────────────────────────
    (function() {
      var beam = document.getElementById('sp-beam');
      var canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
      beam.appendChild(canvas);
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W, H, particles = [];

      function resize() {
        W = canvas.width  = beam.offsetWidth  * dpr;
        H = canvas.height = beam.offsetHeight * dpr;
      }

      function rand(a, b) { return a + Math.random() * (b - a); }

      function spawn() {
        return {
          x:   rand(0.15 * W, 0.85 * W),
          y:   rand(0, H * 0.6),
          r:   rand(0.3, 0.8) * dpr,
          op:  rand(0.1, 0.9),
          dop: rand(0.01, 0.025) * (Math.random() < .5 ? 1 : -1),
          vx:  rand(-0.2, 0.2) * dpr,
          vy:  rand(0.05, 0.3) * dpr
        };
      }

      resize();
      for (var i = 0; i < 500; i++) particles.push(spawn());

      var ro = new ResizeObserver(function() { resize(); });
      ro.observe(beam);

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#4AE54A';
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.op += p.dop;
          if (p.op > 0.9)  { p.op = 0.9;  p.dop = -Math.abs(p.dop); }
          if (p.op < 0.05) { p.op = 0.05; p.dop =  Math.abs(p.dop); }
          p.x += p.vx; p.y += p.vy;
          if (p.y > H) { p.y = 0; p.x = rand(0.15 * W, 0.85 * W); }
          if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
          ctx.globalAlpha = p.op * (1 - p.y / H);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
      }
      draw();
    })();

    document.getElementById('login-form').addEventListener('submit', function() {
      var btn = document.getElementById('login-btn');
      if (!btn.disabled) { btn.classList.add('loading'); btn.disabled = true; }
    });

    {% if rate_wait and rate_wait > 0 %}
    var wait = {{ rate_wait }};
    var btn  = document.getElementById('login-btn');
    var txtEl = btn.querySelector('.btn-text');
    var timer = setInterval(function() {
      if (--wait <= 0) { clearInterval(timer); btn.disabled = false; txtEl.textContent = 'Logga in'; }
      else { txtEl.textContent = 'Vänta ' + wait + 's…'; }
    }, 1000);
    {% endif %}
  </script>
</body>
</html>
